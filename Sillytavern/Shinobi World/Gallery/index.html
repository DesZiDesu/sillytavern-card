<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shinobi World Gallery</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0906;color:#eee6d7;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:2;padding:18px 20px;background:rgba(11,9,6,.95);border-bottom:1px solid #3b3021;backdrop-filter:blur(8px)}h1{margin:0 0 4px;font:700 22px Georgia,serif}p{margin:0;color:#a99b84}.bar{display:flex;gap:10px;margin-top:12px}.bar input{width:min(520px,100%);padding:10px 12px;border:1px solid #574730;border-radius:8px;background:#16110b;color:#fff}main{padding:20px}.status{margin-bottom:14px;color:#c8b48d}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.card{background:#17110a;border:1px solid #3e3325;border-radius:10px;overflow:hidden}.pic{aspect-ratio:1;background:#0d0a06;display:grid;place-items:center}.pic img{width:100%;height:100%;object-fit:cover}.name{padding:9px 10px;font-size:11px;color:#e8dcc5;word-break:break-word}.empty,.err{padding:18px;border:1px solid #54442e;background:#181109;border-radius:8px;color:#d9c6a6}</style></head><body><header><h1>Shinobi World · Repository Gallery</h1><p>Live view of files that actually exist on GitHub <code>main</code>.</p><div class="bar"><input id="q" placeholder="Search character/form filename…"></div></header><main><div id="status" class="status">Loading GitHub directory…</div><div id="grid" class="grid"></div></main><script>const API='https://api.github.com/repos/DesZiDesu/sillytavern-card/contents/Sillytavern/Shinobi%20World/Gallery?ref=main';let files=[];const g=document.getElementById('grid'),s=document.getElementById('status'),q=document.getElementById('q');function render(){const x=q.value.toLowerCase().trim();const list=files.filter(f=>!x||f.name.toLowerCase().includes(x));s.textContent=`Showing ${list.length} of ${files.length} image files currently on main.`;g.innerHTML='';if(!list.length){g.innerHTML='<div class="empty">No matching portrait files are currently committed in this Gallery.</div>';return}for(const f of list){const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="pic"><img loading="lazy" src="${f.download_url}" alt=""></div><div class="name">${f.name}</div>`;g.append(c)}}fetch(API).then(r=>{if(!r.ok)throw Error('GitHub API '+r.status);return r.json()}).then(a=>{files=a.filter(f=>/\.(png|jpe?g|webp|gif|svg)$/i.test(f.name));render()}).catch(e=>{s.textContent='';g.innerHTML=`<div class="err">Could not read the Gallery directory: ${e.message}</div>`});q.oninput=render;</script></body></html>
