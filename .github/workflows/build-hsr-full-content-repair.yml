name: Build HSR full-content repair

on:
  push:
    branches:
      - fix/hsr-full-content-repair
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/hsr-full-content-repair
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and capture diagnostics
        shell: bash
        run: |
          set +e
          python Tools/maintenance/build_hsr_full_embedded_pack.py > build-hsr.log 2>&1
          status=$?
          echo "$status" > build-hsr.exit
          cat build-hsr.log
          exit 0

      - name: Publish permanent ZIP when build succeeded
        shell: bash
        run: |
          if [ "$(cat build-hsr.exit)" = "0" ]; then
            mkdir -p "Sillytavern/Honkai Star Rail/Downloads"
            cp generated-hsr-pack/HSR_Self_Contained_Full_Pack.zip "Sillytavern/Honkai Star Rail/Downloads/HSR_Self_Contained_Full_Pack.zip"
          fi

      - name: Upload pack and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: HSR-Self-Contained-Full-Pack
          if-no-files-found: warn
          path: |
            generated-hsr-pack/*
            build-hsr.log
            build-hsr.exit

      - name: Commit repair files or diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(cat build-hsr.exit)" = "0" ]; then
            git add "Sillytavern/Honkai Star Rail"
            message="Restore full HSR lorebook and embedded card content [skip ci]"
          else
            git add build-hsr.log build-hsr.exit
            message="Capture HSR repair build diagnostics [skip ci]"
          fi
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "$message"
            git push origin HEAD:fix/hsr-full-content-repair
          fi

      - name: Fail when builder failed
        shell: bash
        run: test "$(cat build-hsr.exit)" = "0"
