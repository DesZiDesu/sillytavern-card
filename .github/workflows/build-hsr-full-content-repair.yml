name: Build HSR full-content repair

on:
  push:
    branches:
      - fix/hsr-full-content-repair
    paths:
      - "Sillytavern/Honkai Star Rail/**"
      - "Tools/maintenance/build_hsr_full_embedded_pack.py"
      - ".github/workflows/build-hsr-full-content-repair.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Sillytavern/Honkai Star Rail/**"
      - "Tools/maintenance/build_hsr_full_embedded_pack.py"
      - ".github/workflows/build-hsr-full-content-repair.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate full HSR files
        run: python Tools/maintenance/build_hsr_full_embedded_pack.py

      - name: Publish permanent ZIP in repository
        run: |
          mkdir -p "Sillytavern/Honkai Star Rail/Downloads"
          cp generated-hsr-pack/HSR_Self_Contained_Full_Pack.zip "Sillytavern/Honkai Star Rail/Downloads/HSR_Self_Contained_Full_Pack.zip"

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSR-Self-Contained-Full-Pack
          if-no-files-found: error
          path: generated-hsr-pack/*

      - name: Commit generated repair files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Sillytavern/Honkai Star Rail"
          if git diff --cached --quiet; then
            echo "HSR files are already current."
          else
            git commit -m "Restore full HSR lorebook and embedded card content [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi
