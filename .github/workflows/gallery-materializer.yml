name: Gallery Materializer

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  materialize:
    if: github.event.issue.title == 'RUN GALLERY MATERIALIZER'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize actual HI3 and Shinobi image files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, html, json, shutil

          # ---------------- HI3: exact images from the two uploaded ZIPs ----------------
          hi3 = Path('Honkai Impact 3rd/Gallery')
          if hi3.exists():
              shutil.rmtree(hi3)
          hi3.mkdir(parents=True)
          packs = [
              ('honkai-impact-3-battlesuit-avatars.zip', 'Battlesuit Avatars'),
              ('honkai-impact-3-male-avatars-option-a.zip', 'Male Characters - Option A'),
          ]
          hi3_rows=[]
          seen=set()
          for archive, collection in packs:
              with ZipFile(archive) as zf:
                  for info in zf.infolist():
                      if info.is_dir():
                          continue
                      name=Path(info.filename).name
                      if Path(name).suffix.lower() not in {'.png','.jpg','.jpeg','.webp','.gif'}:
                          continue
                      if name in seen:
                          raise SystemExit(f'HI3 filename collision: {name}')
                      seen.add(name)
                      data=zf.read(info)
                      (hi3/name).write_bytes(data)
                      hi3_rows.append({
                          'filename':name,
                          'collection':collection,
                          'bytes':len(data),
                          'sha256':hashlib.sha256(data).hexdigest(),
                      })
          if len(hi3_rows) != 150:
              raise SystemExit(f'Expected 150 HI3 images, got {len(hi3_rows)}')
          (hi3/'manifest.json').write_text(json.dumps({
              'schema':'hi3_local_gallery.v2',
              'count':len(hi3_rows),
              'collections':{'Battlesuit Avatars':124,'Male Characters - Option A':26},
              'files':hi3_rows,
          }, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          cards=''.join(
              f'<article><img loading="lazy" src="./{html.escape(r["filename"])}"><code>{html.escape(r["filename"])}</code><small>{html.escape(r["collection"])}</small></article>'
              for r in hi3_rows
          )
          (hi3/'index.html').write_text(f'''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HI3 Gallery</title><style>body{{margin:0;background:#07131e;color:#eafaff;font-family:system-ui}}main{{width:min(1300px,calc(100% - 20px));margin:auto;padding:30px 0}}.grid{{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}}article{{border:1px solid #28516d;background:#0d2232;padding:8px}}img{{width:100%;aspect-ratio:1;object-fit:contain;background:#08131d}}code,small{{display:block;overflow-wrap:anywhere;font-size:9px;margin-top:6px}}</style></head><body><main><h1>Honkai Impact 3rd · Gallery</h1><p>150 actual repository image files: 124 Battlesuit + 26 Male.</p><div class="grid">{cards}</div></main></body></html>''', encoding='utf-8')
          PY

          # ---------------- Shinobi: exact bytes downloaded from supplied Catbox URLs ----------------
          G='Sillytavern/Shinobi World/Gallery'
          mkdir -p "$G"
          find "$G" -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) -delete

          expected=$(awk 'NF{n++}END{print n+0}' "$G/sources.tsv")
          if [ "$expected" -ne 159 ]; then
            echo "Expected 159 source rows, found $expected" >&2
            exit 1
          fi

          failures="$RUNNER_TEMP/shinobi-failures.tsv"
          : > "$failures"
          while IFS=$'\t' read -r filename url display_name; do
            [ -n "$filename" ] || continue
            out="$G/$filename"
            echo "Downloading: $display_name -> $filename"
            if ! curl --fail --location --silent --show-error \
                --retry 5 --retry-delay 2 --retry-all-errors \
                --connect-timeout 20 --max-time 120 \
                -A 'Mozilla/5.0 (GitHub Actions; Shinobi Gallery Materializer)' \
                "$url" -o "$out"; then
              printf '%s\t%s\t%s\n' "$filename" "$url" "$display_name" >> "$failures"
              rm -f "$out"
              continue
            fi
            mime=$(file --brief --mime-type "$out" || true)
            case "$mime" in
              image/*) ;;
              *)
                echo "Invalid MIME for $filename: $mime" >&2
                printf '%s\t%s\t%s\n' "$filename" "$url" "$display_name" >> "$failures"
                rm -f "$out"
                ;;
            esac
          done < "$G/sources.tsv"

          if [ -s "$failures" ]; then
            echo 'Failed Shinobi downloads:' >&2
            cat "$failures" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, html, json
          g=Path('Sillytavern/Shinobi World/Gallery')
          rows=[]
          for line in (g/'sources.tsv').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              filename,url,name=line.split('\t',2)
              p=g/filename
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f'Missing actual portrait: {filename}')
              rows.append({
                  'name':name,
                  'filename':filename,
                  'source_url':url,
                  'bytes':p.stat().st_size,
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              })
          if len(rows) != 159:
              raise SystemExit(f'Expected 159 Shinobi images, got {len(rows)}')
          (g/'manifest.json').write_text(json.dumps({
              'schema':'shinobi_world_gallery.v2',
              'base_path':'Sillytavern/Shinobi World/Gallery/',
              'count':len(rows),
              'files':rows,
              'pending_note':'Master-list entries still marked xxxxxx.png are not included until a source URL is supplied.'
          }, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          (g/'README.md').write_text(f'# Shinobi World Gallery\n\nActual repository-hosted image files: **{len(rows)}**.\n\nUse the exact filename from `manifest.json` in the Chronicle `[CHAR|filename|Name|#color|Rank|Village]` token.\n', encoding='utf-8')
          cards=''.join(f'<article class="card"><img loading="lazy" src="./{html.escape(r["filename"])}"><strong>{html.escape(r["name"])}</strong><code>{html.escape(r["filename"])}</code></article>' for r in rows)
          (g/'index.html').write_text(f'''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shinobi World Gallery</title><style>body{{margin:0;background:#0b0906;color:#eee6d7;font-family:system-ui}}main{{width:min(1280px,calc(100% - 20px));margin:auto;padding:30px 0}}input{{width:100%;padding:12px;background:#17110a;color:#fff;border:1px solid #493b28;margin:12px 0 18px}}.grid{{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}}.card{{border:1px solid #3e3325;background:#17110a;padding:8px}}img{{width:100%;aspect-ratio:1;object-fit:cover;background:#080604}}strong,code{{display:block;margin-top:7px;font-size:11px}}code{{color:#aa9a80;overflow-wrap:anywhere}}</style></head><body><main><h1>Shinobi World · GitHub Gallery</h1><p>159 actual image files downloaded from the supplied Catbox links and renamed by character/form.</p><input id="q" placeholder="Search Naruto, Sasuke, ANBU, Sage Mode…"><div class="grid">{cards}</div></main><script>q.oninput=()=>{{let s=q.value.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(s)?'':'none')}}</script></body></html>''', encoding='utf-8')
          PY

          # Delete source ZIPs only after successful exact extraction/download validation.
          rm -f honkai-impact-3-battlesuit-avatars.zip
          rm -f honkai-impact-3-male-avatars-option-a.zip

          # Remove the temporary materializer itself after success.
          rm -f .github/workflows/gallery-materializer.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize actual HI3 and Shinobi gallery images'
          git push origin main

      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Gallery materialization completed and committed to main."
