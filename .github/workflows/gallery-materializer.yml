name: Gallery Materializer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-materializer.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract HI3 packs and download Shinobi portraits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json, hashlib, shutil

          dest = Path('Honkai Impact 3rd/Gallery')
          if dest.exists():
              shutil.rmtree(dest)
          dest.mkdir(parents=True)
          archives = [
              ('honkai-impact-3-battlesuit-avatars.zip', 'Battlesuit Avatars'),
              ('honkai-impact-3-male-avatars-option-a.zip', 'Male Characters — Option A'),
          ]
          rows=[]
          seen=set()
          for archive, collection in archives:
              with ZipFile(archive) as zf:
                  for info in zf.infolist():
                      if info.is_dir():
                          continue
                      name=Path(info.filename).name
                      if Path(name).suffix.lower() not in {'.png','.jpg','.jpeg','.webp','.gif'}:
                          continue
                      if name in seen:
                          raise SystemExit(f'HI3 filename collision: {name}')
                      seen.add(name)
                      data=zf.read(info)
                      (dest/name).write_bytes(data)
                      rows.append({'filename':name,'collection':collection,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          if len(rows) != 150:
              raise SystemExit(f'Expected 150 HI3 portraits, got {len(rows)}')
          manifest={'schema':'hi3_local_gallery.v1','game':'Honkai Impact 3rd','base_path':'Honkai Impact 3rd/Gallery/','count':len(rows),'collections':{'Battlesuit Avatars':124,'Male Characters — Option A':26},'files':rows}
          (dest/'manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          (dest/'README.md').write_text('# Honkai Impact 3rd Gallery\n\nRepository-local gallery containing both imported portrait packs in one directory.\n\n- 124 Battlesuit Avatars\n- 26 Male Characters — Option A\n- 150 portraits total\n\nSee `manifest.json` for collection provenance, byte sizes, and SHA-256 hashes.\n',encoding='utf-8')

          p=Path('Honkai Impact 3rd/project.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          obj.setdefault('paths',{})['portrait_gallery_local']='Gallery/'
          obj['portrait_collections']=['Battlesuit Avatars','Male Characters — Option A']
          p.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY

          GALLERY='Sillytavern/Shinobi World/Gallery'
          mkdir -p "$GALLERY"
          failures="$RUNNER_TEMP/shinobi-failures.txt"
          : > "$failures"
          while IFS=$'\t' read -r filename url display_name; do
            [ -n "$filename" ] || continue
            tmp="$RUNNER_TEMP/$filename"
            echo "Downloading $display_name -> $filename"
            if ! curl --fail --location --silent --show-error \
                 --retry 4 --retry-delay 2 --retry-all-errors \
                 --connect-timeout 20 --max-time 120 \
                 -A 'Mozilla/5.0 GitHubGalleryMaterializer/1.0' \
                 "$url" -o "$tmp"; then
              printf '%s\t%s\t%s\n' "$filename" "$url" "$display_name" >> "$failures"
              continue
            fi
            if [ ! -s "$tmp" ]; then
              printf '%s\t%s\t%s\n' "$filename" "$url" "$display_name" >> "$failures"
              continue
            fi
            mv "$tmp" "$GALLERY/$filename"
          done < "$GALLERY/sources.tsv"

          if [ -s "$failures" ]; then
            echo 'These Shinobi downloads failed:'
            cat "$failures"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, html
          g=Path('Sillytavern/Shinobi World/Gallery')
          rows=[]
          for line in (g/'sources.tsv').read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              filename,url,name=line.split('\t',2)
              p=g/filename
              if not p.exists() or not p.stat().st_size:
                  raise SystemExit(f'Missing downloaded portrait: {filename}')
              rows.append({'name':name,'filename':filename,'source_url':url,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          if len(rows) != 159:
              raise SystemExit(f'Expected 159 supplied Shinobi portraits, got {len(rows)}')
          manifest={'schema':'shinobi_world_gallery.v2','base_path':'Sillytavern/Shinobi World/Gallery/','usage':'[CHAR|filename|Name|#color|Rank|Village]','count':len(rows),'files':rows,'pending_note':'Entries still marked xxxxxx.png in the user master list are intentionally not materialized until a source image is supplied.'}
          (g/'manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          (g/'README.md').write_text(f'''# Shinobi World Gallery\n\nRepository-backed portrait directory for the optional Shinobi Chronicle UI packs.\n\nMaterialized portraits: **{len(rows)}**\n\nUse the exact filename from `manifest.json`, for example:\n\n`[CHAR|naruto-uzumaki-genin.jpg|Naruto Uzumaki|#e58b38|Genin|Konohagakure]`\n\nChronicle headers resolve the filename from `Sillytavern/Shinobi World/Gallery/<filename>` on `main`. Entries still shown as `xxxxxx.png` in the unfinished master list remain pending.\n''',encoding='utf-8')

          cards=''.join(f'''<article class="card"><img loading="lazy" src="./{html.escape(r['filename'])}" alt="{html.escape(r['name'])}"><div class="info"><strong>{html.escape(r['name'])}</strong><code>{html.escape(r['filename'])}</code></div></article>''' for r in rows)
          page=f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shinobi World · GitHub Gallery</title><style>:root{{--bg:#0c0a07;--panel:#15110c;--line:#393020;--paper:#efe7d3;--ink:#f0e8d8;--muted:#a99c82;--seal:#a94b3c}}*{{box-sizing:border-box}}body{{margin:0;background:radial-gradient(circle at 20% 0,#20170f,transparent 38rem),var(--bg);color:var(--ink);font-family:Georgia,serif}}main{{width:min(1280px,calc(100% - 28px));margin:auto;padding:36px 0 70px}}header{{max-width:780px;margin-bottom:28px}}.eyebrow{{font:700 11px system-ui;letter-spacing:.2em;color:#c8a56d}}h1{{font-size:clamp(30px,6vw,58px);margin:8px 0}}p{{color:var(--muted);line-height:1.6}}.sample{{max-width:560px;display:flex;align-items:center;gap:15px;border-bottom:1px solid #302719;padding:13px 0;margin:25px 0 34px}}.sample img{{width:58px;height:58px;object-fit:cover;border:5px solid #171009;outline:1px solid #5a4b37}}.sample .line{{width:34px;height:2px;background:var(--seal);margin-bottom:7px}}.sample strong{{display:block;letter-spacing:.08em}}.sample small{{color:var(--muted)}}.tools{{position:sticky;top:8px;z-index:4;padding:10px;background:#0c0a07e8;backdrop-filter:blur(12px);border:1px solid #302719;margin-bottom:16px}}input{{width:100%;padding:12px;background:#15110c;border:1px solid #443825;color:var(--ink);font:inherit}}.grid{{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}}.card{{background:var(--panel);border:1px solid var(--line);overflow:hidden}}.card img{{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#0a0805}}.info{{padding:10px}}.info strong{{display:block;font-size:13px;line-height:1.3;min-height:2.6em}}code{{display:block;margin-top:7px;color:#9b8c73;font:10px ui-monospace,monospace;overflow-wrap:anywhere}}@media(max-width:520px){{main{{width:calc(100% - 14px);padding-top:14px}}.grid{{grid-template-columns:1fr 1fr;gap:7px}}}}</style></head><body><main><header><div class="eyebrow">SHINOBI WORLD · CHRONICLE GALLERY</div><h1>Repository Portrait Gallery</h1><p>{len(rows)} supplied Catbox portraits have been materialized into GitHub and renamed by character/form. The Chronicle regex uses these local filenames.</p></header><section class="sample"><img src="./naruto-uzumaki-genin.jpg" alt="Naruto Uzumaki"><div><div class="line"></div><strong>NARUTO UZUMAKI</strong><small>Genin · Konohagakure · Chronicle local portrait</small></div></section><div class="tools"><input id="q" type="search" placeholder="Search Naruto, Sasuke, ANBU, Sage Mode…"></div><section class="grid" id="grid">{cards}</section></main><script>const q=document.getElementById('q');q.addEventListener('input',()=>{{const s=q.value.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(s)?'':'none')}});</script></body></html>'''
          (g/'preview.html').write_text(page,encoding='utf-8')

          h=Path('Honkai Impact 3rd/Gallery')
          hi=json.loads((h/'manifest.json').read_text(encoding='utf-8'))
          hi_cards=''.join(f'''<article><img loading="lazy" src="./{html.escape(r['filename'])}" alt="{html.escape(r['filename'])}"><code>{html.escape(r['filename'])}</code><small>{html.escape(r['collection'])}</small></article>''' for r in hi['files'])
          hi_page=f'''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HI3 Local Gallery</title><style>body{{margin:0;background:#07131e;color:#eafaff;font-family:system-ui}}main{{width:min(1300px,calc(100% - 20px));margin:auto;padding:30px 0}}h1{{font-size:clamp(28px,6vw,56px)}}p,small{{color:#93b6c9}}.grid{{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}}article{{border:1px solid #28516d;background:#0d2232;padding:8px}}img{{width:100%;aspect-ratio:1;object-fit:contain;background:#08131d}}code,small{{display:block;overflow-wrap:anywhere;font-size:9px;margin-top:6px}}</style></head><body><main><h1>Honkai Impact 3rd · Local Gallery</h1><p>150 portraits · 124 Battlesuit Avatars + 26 Male Characters — Option A · one repository folder.</p><div class="grid">{hi_cards}</div></main></body></html>'''
          (h/'index.html').write_text(hi_page,encoding='utf-8')
          PY

          rm -f honkai-impact-3-battlesuit-avatars.zip honkai-impact-3-male-avatars-option-a.zip
          rm -f __actions_probe__.txt
          rm -f .github/workflows/gallery-materializer.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Materialize HI3 and Shinobi portrait galleries'
          git push
