name: Generate HSR embedded cards

on:
  push:
    branches:
      - fix/hsr-embedded-cards
  pull_request:
    branches:
      - main
    paths:
      - "Sillytavern/Honkai Star Rail/**"
      - "Tools/maintenance/generate_hsr_embedded_cards.py"
      - ".github/workflows/hsr-embedded-card-generator.yml"

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards and capture diagnostics
        shell: bash
        run: |
          set +e
          python Tools/maintenance/generate_hsr_embedded_cards.py > hsr-generator.log 2>&1
          status=$?
          echo "$status" > hsr-generator.exit
          cat hsr-generator.log
          exit 0

      - name: Commit generated files or diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Sillytavern/Honkai Star Rail" hsr-generator.log hsr-generator.exit
          if git diff --cached --quiet; then
            echo "Generated files and diagnostics are already current."
          else
            git commit -m "Run HSR embedded-card generator"
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi

      - name: Package corrected files when available
        if: ${{ hashFiles('Sillytavern/Honkai Star Rail/Bot/Variants/*.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hsr-fixed-cards-and-lorebook
          if-no-files-found: error
          path: |
            Sillytavern/Honkai Star Rail/Bot/Honkai Star Rail RPG.json
            Sillytavern/Honkai Star Rail/Bot/Variants/*.json
            Sillytavern/Honkai Star Rail/Bot/README.md
            Sillytavern/Honkai Star Rail/Lorebook/Honkai Star Rail [LB].json
            hsr-generator.log
            hsr-generator.exit
