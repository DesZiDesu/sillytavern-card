<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Honkai Impact 3rd Gallery</title><style>*{box-sizing:border-box}body{margin:0;background:#07131d;color:#dff7ff;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:2;padding:18px 20px;background:rgba(7,19,29,.94);border-bottom:1px solid #21475a;backdrop-filter:blur(8px)}h1{margin:0 0 4px;font-size:22px}p{margin:0;color:#86a9b8}.bar{display:flex;gap:10px;margin-top:12px}.bar input{width:min(520px,100%);padding:10px 12px;border:1px solid #2d6077;border-radius:8px;background:#0b1d2a;color:#fff}main{padding:20px}.status{margin-bottom:14px;color:#8fdcf2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.card{background:#0d2230;border:1px solid #1f4b60;border-radius:10px;overflow:hidden}.pic{aspect-ratio:1;background:#061019;display:grid;place-items:center}.pic img{width:100%;height:100%;object-fit:cover}.name{padding:9px 10px;font-size:11px;color:#ccebf4;word-break:break-word}.err{padding:18px;border:1px solid #6d3d3d;background:#261414;border-radius:8px;color:#ffd7d7}</style></head><body><header><h1>Honkai Impact 3rd · Repository Gallery</h1><p>Live view of files that actually exist on GitHub <code>main</code>.</p><div class="bar"><input id="q" placeholder="Search filename…"></div></header><main><div id="status" class="status">Loading GitHub directory…</div><div id="grid" class="grid"></div></main><script>const API='https://api.github.com/repos/DesZiDesu/sillytavern-card/contents/Honkai%20Impact%203rd/Gallery?ref=main';let files=[];const g=document.getElementById('grid'),s=document.getElementById('status'),q=document.getElementById('q');function render(){const x=q.value.toLowerCase().trim();const list=files.filter(f=>!x||f.name.toLowerCase().includes(x));s.textContent=`Showing ${list.length} of ${files.length} image files currently on main.`;g.innerHTML='';for(const f of list){const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="pic"><img loading="lazy" src="${f.download_url}" alt=""></div><div class="name">${f.name}</div>`;g.append(c)}}fetch(API).then(r=>{if(!r.ok)throw Error('GitHub API '+r.status);return r.json()}).then(a=>{files=a.filter(f=>/\.(png|jpe?g|webp|gif|svg)$/i.test(f.name));render()}).catch(e=>{s.textContent='';g.innerHTML=`<div class="err">Could not read the Gallery directory: ${e.message}</div>`});q.oninput=render;</script></body></html>
